# Local build override for Dograh.
#
# This swaps the registry-backed images in docker-compose.yaml for builds from
# the current checkout so local code changes are picked up on rebuild.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: dograh-local/dograh-api:local
    pull_policy: never

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: dograh-local/dograh-ui:local
    pull_policy: never
